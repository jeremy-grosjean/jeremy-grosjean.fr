# Surveillance du site EN LIGNE chaque matin (surveillance synthétique) : https://jeremy-grosjean.fr est visité
# comme par un vrai visiteur (fichiers, en-têtes de sécurité, certificat HTTPS, security.txt, fenêtres, un jeu joué
# jusqu'au bout, aucune erreur). En cas de problème, la vérification échoue et GitHub envoie un e-mail.
# Aucun mot de passe ni clé n'est utilisé. Détails : METHODE.md
name: Surveiller le site en ligne

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surveiller:
    name: Site en ligne
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer le navigateur
        run: |
          python -m pip install --disable-pip-version-check playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Visiter jeremy-grosjean.fr comme un visiteur
        run: python3 outils/surveiller.py
